# Initial specification only: pipeline modules and config validation are not implemented yet.
# Resolve all relative paths from the project root, not from this file's directory.
seed: 42

paths:
  raw_corpus: data/raw
  processed_corpus: data/processed/ubertext_sentences.txt
  subsets: data/subsets
  evaluation: ua_asr_hypotheses_500.jsonl
  models: models
  metrics: results/metrics
  predictions: results/predictions
  figures: results/figures
  logs: results/logs

corpus:
  name: UberText
  source_page: https://lang.org.ua/en/ubertext/
  # Select a release/export and record its license and checksums before downloading.
  release: null
  download_url: null
  input_files: []
  encoding: utf-8

preprocessing:
  version: v1-planned
  # Choose and document a Ukrainian-aware segmenter after inspecting the corpus format.
  sentence_segmenter: null
  unicode_normalization: NFC
  lowercase: true
  apostrophe: "'"
  punctuation: separate_except_internal_apostrophes
  collapse_whitespace: true
  preserve_digits: true
  correct_recognition_errors: false
  drop_empty_training_sentences: true
  deduplicate_training_sentences: true
  exclude_evaluation_overlap: true
  overlap_fields: [reference, hypotheses]

experiments:
  ngram_orders: [1, 2, 3]
  corpus_word_tokens: [100000, 1000000, 10000000]
  # Seed a single sentence order once, then take nested whole-sentence prefixes.
  subset_policy: whole_sentence_prefix_at_most
  record_actual_token_counts: true
  reuse_matching_models: true

kenlm:
  # Run training and scoring inside WSL2/Linux, with these executables on PATH.
  lmplz: lmplz
  build_binary: build_binary
  memory: 2G
  binary_type: probing
  keep_arpa: true
  verify_unigram_support: true
  on_unsupported_unigram: error

scoring:
  selection: minimum_perplexity
  log_base: 10
  bos: true
  eos: true
  # README: N = word tokens only, even though score includes EOS.
  perplexity_denominator: word_tokens
  tie_break: first_candidate
  empty_normalized_candidate: error

evaluation:
  expected_records: 500
  id_field: utt_id
  reference_field: reference
  candidates_field: hypotheses
  require_unique_ids: true
  preserve_candidate_order: true
  match_on: normalized_text
  primary_metric: exact_match_accuracy
  metrics: [exact_match_accuracy, wer, cer, mrr, oracle_accuracy, oov_rate]
  edit_rate_aggregation: corpus
  cer_include_spaces: true
  mrr_missing_reference: 0.0
  oov_texts: [references, hypotheses, selected]
  baselines: [first_candidate, seeded_random]
  measure_inference_time: true
  save_individual_predictions: true

llm:
  enabled: false
