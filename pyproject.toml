[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "asr-rescoring"
version = "0.1.0"
description = "Ukrainian ASR candidate rescoring with classical KenLM language models"
readme = "readme.md"
requires-python = ">=3.11,<3.14"
dependencies = ["pyyaml>=6.0.2,<7"]

[project.optional-dependencies]
# Opt in under WSL2/Linux; a native build toolchain is required.
kenlm = ["kenlm==0.3.0"]
llm = ["psutil>=7,<8"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]
analysis = [
    "jupyterlab>=4.3,<5",
    "ipykernel>=6.29,<8",
    "pandas>=2.2,<3",
    "matplotlib>=3.9,<4",
]
report = [
    "pymupdf>=1.26,<2",
    "reportlab>=4.4,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/asr_rescoring"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: opt-in native KenLM integration checks"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
